<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NephroSense API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 800px;
        }

        .badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 30px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 20px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #00d2ff;
        }

        .stat-label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,210,255,0.3);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            transform: translateY(-2px);
        }

        .status {
            margin-top: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">AI-Powered Clinical Decision Support</div>
        
        <h1>NephroSense</h1>
        <p class="tagline">Chronic Kidney Disease Stage Prediction System</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-number">6</div>
                <div class="stat-label">CKD Stages</div>
            </div>
            <div class="stat">
                <div class="stat-number">26</div>
                <div class="stat-label">Features</div>
            </div>
            <div class="stat">
                <div class="stat-number">98.6%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat">
                <div class="stat-number">2</div>
                <div class="stat-label">Models</div>
            </div>
        </div>

        <div class="buttons">
            <a href="/docs" class="btn btn-primary">Swagger UI</a>
            <a href="/redoc" class="btn btn-secondary">ReDoc</a>
        </div>

        <div class="status">
    <div class="dot"></div>
    API is running &mdash; v1.0.0  
</div>
</body>
</html>
