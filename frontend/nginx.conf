server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache CSS and JS
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # CORS for backend API calls
    add_header Access-Control-Allow-Origin *;
}